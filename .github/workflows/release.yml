name: release

# Builds release binaries for a version tag and attaches them to a GitHub release, with
# SHA256SUMS and build provenance, so CI elsewhere can download and verify a binary instead of
# compiling it, then publishes the crate to crates.io. Tags normally come from merging the
# release-please PR (release-please.yml); a hand-pushed tag for the version in Cargo.toml on a
# main commit works the same way.
#
# crates.io trusts this file by name (trusted publishing, OIDC), so renaming it, or moving the
# publish job into another workflow, breaks publishing until the trusted publisher is updated.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag must name the version Cargo.toml declares and a commit main already has.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag against Cargo.toml and main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.18
      - name: Add the target to the pinned toolchain
        run: mise exec -- rustup target add ${{ matrix.target }}
      - name: Build
        run: mise exec -- cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="doppelscan-${GITHUB_REF_NAME}-${TARGET}"
          exe=""; [[ "$TARGET" == *windows* ]] && exe=".exe"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/doppelscan$exe" LICENSE README.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then 7z a -bd "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doppelscan-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: doppelscan-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum doppelscan-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/doppelscan-*
      # release-please creates a draft release, with its changelog as notes, when it tags; it
      # stays a draft until every asset is attached, so `releases/latest` never lacks binaries.
      # A hand-pushed tag has no release yet. --clobber lets a re-run replace assets a failed
      # attempt uploaded.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # After the binaries, so a crate version (which can never be replaced) only goes out once
  # every target built.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.18
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: mise exec -- cargo publish --locked
