[package]
name = "doppelscan"
version = "0.1.0"
edition = "2024"
description = "Fast syntax-aware duplicate code finder with an MCP server for coding agents"
license = "MIT"
rust-version = "1.91"
repository = "https://github.com/CMaintz/doppelscan"
readme = "README.md"
keywords = ["duplicate-code", "clone-detection", "tree-sitter", "mcp", "refactoring"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".github/", "examples/"]

[[bin]]
name = "doppelscan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
mimalloc = "0.1.52"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
